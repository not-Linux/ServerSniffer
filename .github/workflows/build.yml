name: Build ServerSniffer

on:
  push:
    branches: [main, master, "26.2"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # main (1.21.4) needs 21, 26.2 needs 25 — branch 26.2 declares java 25 via toolchain
          java-version: 25

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServerSniffer-jar
          path: build/libs/*.jar
          if-no-files-found: error
